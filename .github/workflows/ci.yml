name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/expense_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/expense_tracker_test
      SECRET_KEY: ci-test-secret-key-2026


    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d expense_tracker_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t fastapi-expense-tracker .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag fastapi-expense-tracker ghcr.io/fchwpo05/fastapi-expense-tracker:latest

      - name: Tag Docker image with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag fastapi-expense-tracker ghcr.io/fchwpo05/fastapi-expense-tracker:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/fchwpo05/fastapi-expense-tracker:latest

      - name: Push Docker image with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/fchwpo05/fastapi-expense-tracker:${{ github.sha }}